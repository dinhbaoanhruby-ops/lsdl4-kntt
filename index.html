<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Tập Lịch Sử & Địa Lí 4 (KNTT) - Bài 4 đến Bài 7</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #059669;
            --accent: #d97706;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #cbd5e1;
            --success-bg: #dcfce7;
            --success-border: #16a34a;
            --error-bg: #fee2e2;
            --error-border: #dc2626;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; padding: 0; background-color: var(--bg); color: var(--text); line-height: 1.6; }
        
        /* Header */
        header {
            background: linear-gradient(135deg, #1e40af, #2563eb);
            color: white;
            padding: 1.2rem 1.5rem;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header h1 { margin: 0; font-size: 1.5rem; }
        header p { margin: 0.3rem 0 0; font-size: 0.9rem; opacity: 0.9; }
        .save-badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 2px 10px;
            border-radius: 99px;
            font-size: 0.8rem;
            margin-top: 5px;
        }

        /* Container */
        .container { max-width: 960px; margin: 1.5rem auto; padding: 0 1rem; }

        /* Navigation Tabs */
        .lesson-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.2rem;
            justify-content: center;
        }
        .lesson-btn {
            padding: 0.65rem 1.1rem;
            border: 2px solid var(--primary);
            background: white;
            color: var(--primary);
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }
        .lesson-btn:hover { background: #eff6ff; }
        .lesson-btn.active { background: var(--primary); color: white; }
        .lesson-btn.exam-btn { border-color: var(--accent); color: var(--accent); }
        .lesson-btn.exam-btn.active { background: var(--accent); color: white; }

        /* Sub-tabs inside a lesson */
        .sub-nav {
            display: flex;
            gap: 0.5rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.6rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .sub-btn {
            padding: 0.5rem 1rem;
            border: none;
            background: #e2e8f0;
            color: var(--text);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .sub-btn.active { background: var(--secondary); color: white; }

        /* Cards */
        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 1.5rem;
        }
        .summary-box {
            background: #eff6ff;
            border-left: 5px solid var(--primary);
            padding: 1rem 1.2rem;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
        }

        /* Flashcards / Timeline cards */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1rem;
        }
        .info-card {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
            background: #f8fafc;
            transition: transform 0.2s;
        }
        .info-card:hover { transform: translateY(-2px); border-color: var(--primary); }
        .info-card-tag {
            display: inline-block;
            background: var(--primary);
            color: white;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            margin-bottom: 0.5rem;
        }
        .info-card h4 { margin: 0.2rem 0 0.5rem; color: var(--primary-dark); }
        .info-card p { margin: 0; font-size: 0.92rem; }

        /* Picture Puzzle / Map Simulation */
        .puzzle-box {
            border: 2px dashed #94a3b8;
            border-radius: 12px;
            padding: 1.2rem;
            background: #f8fafc;
            text-align: center;
            margin-bottom: 1.2rem;
        }
        .puzzle-img-placeholder {
            max-width: 100%;
            margin: 0 auto 1rem;
            border-radius: 8px;
            overflow: hidden;
            background: #e2e8f0;
            padding: 1rem;
        }
        .puzzle-img-placeholder img {
            max-width: 100%;
            max-height: 320px;
            border-radius: 6px;
            display: block;
            margin: 0 auto;
        }
        .timeline-sim {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            margin: 1.5rem 0;
            padding: 0 10px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .timeline-node {
            background: white;
            border: 2px solid var(--primary);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            flex: 1;
            min-width: 140px;
            text-align: center;
        }

        /* Quiz Items */
        .q-item {
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 1.2rem;
            margin-bottom: 1.2rem;
            background: white;
            transition: all 0.2s;
        }
        .q-item.correct-box {
            border-color: var(--success-border);
            background-color: #f0fdf4;
        }
        .q-item.wrong-box {
            border-color: var(--error-border);
            background-color: #fef2f2;
        }
        .q-title { font-weight: 700; margin-bottom: 0.8rem; font-size: 1.02rem; }
        .q-badge {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: #e2e8f0;
            color: #475569;
            margin-right: 6px;
            font-weight: 600;
        }
        .options-list { display: flex; flex-direction: column; gap: 0.5rem; }
        .opt-label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.6rem 0.9rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            background: white;
            transition: 0.15s;
        }
        .opt-label:hover { background: #f1f5f9; }
        .opt-label.opt-correct { background: var(--success-bg); border-color: var(--success-border); font-weight: 600; }
        .opt-label.opt-wrong { background: var(--error-bg); border-color: var(--error-border); }

        /* Fill in the blank */
        .fill-group { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
        .fill-input {
            padding: 0.55rem 0.9rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            min-width: 240px;
        }
        .btn-check {
            padding: 0.55rem 1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-check:hover { background: var(--primary-dark); }

        /* Feedback Box */
        .feedback {
            margin-top: 0.8rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.92rem;
            display: none;
        }
        .feedback.show { display: block; }
        .feedback.ok { background: var(--success-bg); color: #14532d; border-left: 4px solid var(--success-border); }
        .feedback.err { background: var(--error-bg); color: #7f1d1d; border-left: 4px solid var(--error-border); }

        /* Exam Section */
        .exam-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fffbeb;
            border: 2px solid var(--accent);
            padding: 1rem 1.2rem;
            border-radius: 10px;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .timer-display {
            font-size: 1.4rem;
            font-weight: 800;
            color: #b45309;
            background: white;
            padding: 0.4rem 1rem;
            border-radius: 8px;
            border: 1px solid #fcd34d;
        }
        .btn-submit-exam {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-reset {
            background: #64748b;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            border-radius: 6px;
            cursor: pointer;
        }
        .score-banner {
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .score-big { font-size: 2.5rem; font-weight: 800; margin: 0.3rem 0; }
        table.ans-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            font-size: 0.9rem;
        }
        table.ans-table th, table.ans-table td {
            border: 1px solid var(--border);
            padding: 0.6rem;
            text-align: left;
        }
        table.ans-table th { background: #f1f5f9; }
    </style>
</head>

// ================= TRẠNG THÁI & LƯU TRỮ TỰ ĐỘNG (LOCALSTORAGE) =================
const STORAGE_KEY = "lsdl4_kntt_b4_b7_v1";
let state = {
    currentLesson: "b4",
    currentSubTab: "summary", // summary | puzzle | de1 | de2
    answers: {}, // { qId: { userVal, isCorrect } }
    exam: {
        started: false,
        submitted: false,
        timeLeft: 600, // 10 phút = 600 giây
        userAnswers: {}, // { ex1: 0, ... }
        score: 0
    }
};

let timerInterval = null;

function loadState() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            const parsed = JSON.parse(saved);
            state = { ...state, ...parsed, exam: { ...state.exam, ...(parsed.exam || {}) } };
        }
    } catch (e) { console.error(e); }
}

function saveState() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        const badge = document.getElementById("saveStatus");
        if (badge) {
            badge.textContent = "✅ Đã tự động lưu tiến độ lúc " + new Date().toLocaleTimeString("vi-VN");
        }
    } catch (e) { console.error(e); }
}

// ================= ĐIỀU HƯỚNG =================
function selectLesson(lessonKey) {
    state.currentLesson = lessonKey;
    if (lessonKey !== "exam" && !["summary", "puzzle", "de1", "de2"].includes(state.currentSubTab)) {
        state.currentSubTab = "summary";
    }
    saveState();
    render();
}

function selectSubTab(subKey) {
    state.currentSubTab = subKey;
    saveState();
    render();
}

// ================= XỬ LÝ TRẢ LỜI LUYỆN TẬP & ĐỐ TRANH =================
function handleMC(qId, optIndex, correctIndex) {
    const isCorrect = (optIndex === correctIndex);
    state.answers[qId] = { userVal: optIndex, isCorrect };
    saveState();
    render();
}

function handleFill(qId, validAnswers) {
    const inputEl = document.getElementById("input_" + qId);
    if (!inputEl) return;
    const raw = inputEl.value.trim();
    if (!raw) {
        alert("Em hãy nhập câu trả lời trước khi kiểm tra nhé!");
        return;
    }
    const norm = raw.toLowerCase().replace(/\s+/g, " ");
    const isCorrect = validAnswers.some(ans => ans.toLowerCase().replace(/\s+/g, " ") === norm);
    state.answers[qId] = { userVal: raw, isCorrect };
    saveState();
    render();
}

function resetLessonProgress(lessonKey) {
    if (!confirm("Em có chắc muốn xoá kết quả làm bài của phần này để làm lại từ đầu không?")) return;
    const prefix = lessonKey + "_";
    Object.keys(state.answers).forEach(k => {
        if (k.startsWith(prefix)) delete state.answers[k];
    });
    saveState();
    render();
}

// ================= RENDER CÂU HỎI TƯƠNG TÁC =================
function renderQuestionList(questions, lessonKey) {
    let html = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <span style="color:var(--text-light); font-size:0.9rem;">💡 Chọn đáp án để xem giải thích và căn cứ SGK ngay lập tức.</span>
        <button class="btn-reset" onclick="resetLessonProgress('${lessonKey}')">🔄 Làm lại phần này</button>
    </div>`;

    questions.forEach(item => {
        const saved = state.answers[item.id];
        let boxClass = "q-item";
        if (saved) boxClass += saved.isCorrect ? " correct-box" : " wrong-box";

        html += `<div class="${boxClass}">`;
        html += `<div class="q-title">`;
        if (item.level) html += `<span class="q-badge">${item.level}</span>`;
        html += `${item.q}</div>`;

        if (item.type === "mc") {
            html += `<div class="options-list">`;
            item.opts.forEach((opt, idx) => {
                let optClass = "opt-label";
                let checked = "";
                if (saved) {
                    if (saved.userVal === idx) {
                        checked = "checked";
                        optClass += saved.isCorrect ? " opt-correct" : " opt-wrong";
                    } else if (!saved.isCorrect && idx === item.ans) {
                        optClass += " opt-correct";
                    }
                }
                html += `<label class="${optClass}" onclick="handleMC('${item.id}', ${idx}, ${item.ans})">
                    <input type="radio" name="${item.id}" ${checked} style="pointer-events:none;">
                    <span><b>${String.fromCharCode(65 + idx)}.</b> ${opt}</span>
                </label>`;
            });
            html += `</div>`;
        } else if (item.type === "fill") {
            const val = saved ? saved.userVal : "";
            const validStr = JSON.stringify(item.ans).replace(/"/g, '&quot;');
            html += `<div class="fill-group">
                <input type="text" id="input_${item.id}" class="fill-input" placeholder="Nhập từ còn thiếu..." value="${val}" onkeydown="if(event.key==='Enter') handleFill('${item.id}', ${validStr})">
                <button class="btn-check" onclick="handleFill('${item.id}', ${validStr})">Kiểm tra</button>
            </div>`;
        }

        if (saved) {
            if (saved.isCorrect) {
                html += `<div class="feedback show ok">
                    <strong>✅ Chính xác!</strong><br>
                    📖 <em>Căn cứ sách giáo khoa:</em> ${item.ref}
                </div>`;
            } else {
                const rightText = item.type === "mc" ? `${String.fromCharCode(65 + item.ans)}. ${item.opts[item.ans]}` : item.displayAns;
                html += `<div class="feedback show err">
                    <strong>❌ Chưa chính xác!</strong> Đáp án đúng là: <b>${rightText}</b><br>
                    💡 <em>Lý do sai:</em> ${item.wrongReason}<br>
                    📖 <em>Căn cứ sách:</em> ${item.ref}
                </div>`;
            }
        }
        html += `</div>`;
    });
    return html;
}

// ================= XỬ LÝ ĐỀ TỔNG HỢP BẤM GIỜ =================
function startExam() {
    state.exam.started = true;
    state.exam.submitted = false;
    state.exam.timeLeft = 600;
    state.exam.userAnswers = {};
    saveState();
    startTimer();
    render();
}

function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    if (!state.exam.started || state.exam.submitted) return;
    timerInterval = setInterval(() => {
        if (state.exam.timeLeft > 0) {
            state.exam.timeLeft--;
            saveState();
            const timerEl = document.getElementById("timerDisplay");
            if (timerEl) timerEl.textContent = formatTime(state.exam.timeLeft);
        } else {
            clearInterval(timerInterval);
            submitExam(true);
        }
    }, 1000);
}

function formatTime(sec) {
    const m = Math.floor(sec / 60).toString().padStart(2, "0");
    const s = (sec % 60).toString().padStart(2, "0");
    return `${m}:${s}`;
}

function selectExamOpt(qId, optIdx) {
    if (state.exam.submitted) return;
    state.exam.userAnswers[qId] = optIdx;
    saveState();
    render();
}

function submitExam(auto = false) {
    if (!auto) {
        const answeredCount = Object.keys(state.exam.userAnswers).length;
        if (answeredCount < EXAM_QUESTIONS.length) {
            if (!confirm(`Em mới làm ${answeredCount}/${EXAM_QUESTIONS.length} câu. Em vẫn muốn nộp bài chứ?`)) return;
        }
    }
    if (timerInterval) clearInterval(timerInterval);
    let correctCount = 0;
    EXAM_QUESTIONS.forEach(q => {
        if (state.exam.userAnswers[q.id] === q.ans) correctCount++;
    });
    state.exam.submitted = true;
    state.exam.score = (correctCount / EXAM_QUESTIONS.length) * 10;
    saveState();
    render();
}

function renderExam() {
    const ex = state.exam;
    let html = `<div class="card">`;
    html += `<h2 style="margin-top:0; color:var(--accent);">⏱️ ĐỀ KIỂM TRA TỔNG HỢP (BÀI 4 – BÀI 7)</h2>`;
    html += `<p>Gồm 10 câu hỏi trắc nghiệm bao quát kiến thức Bài 4, 5, 6, 7. Thời gian làm bài: <b>10 phút</b>. Chấm điểm thang 10.</p>`;

    if (!ex.started && !ex.submitted) {
        html += `<div style="text-align:center; padding:2rem 0;">
            <button class="btn-submit-exam" onclick="startExam()">▶️ Bắt đầu làm bài (10:00)</button>
        </div></div>`;
        return html;
    }

    if (ex.submitted) {
        html += `<div class="score-banner">
            <div>KẾT QUẢ BÀI KIỂM TRA TỔNG HỢP</div>
            <div class="score-big">${ex.score.toFixed(1)} / 10 điểm</div>
            <div>Số câu trả lời đúng: <b>${Math.round(ex.score)} / ${EXAM_QUESTIONS.length} câu</b></div>
            <button class="btn-reset" style="margin-top:1rem; background:white; color:#059669; font-weight:700;" onclick="startExam()">🔄 Làm lại đề tổng hợp</button>
        </div>`;

        html += `<h3>📋 Bảng đáp án & Căn cứ chi tiết</h3>`;
        html += `<table class="ans-table">
            <thead>
                <tr>
                    <th>Câu</th>
                    <th>Đáp án em chọn</th>
                    <th>Đáp án đúng</th>
                    <th>Kết quả & Căn cứ SGK</th>
                </tr>
            </thead><tbody>`;
        EXAM_QUESTIONS.forEach((q, i) => {
            const uIdx = ex.userAnswers[q.id];
            const uText = uIdx !== undefined ? `${String.fromCharCode(65 + uIdx)}. ${q.opts[uIdx]}` : "<em>Bỏ trống</em>";
            const rText = `${String.fromCharCode(65 + q.ans)}. ${q.opts[q.ans]}`;
            const isOk = uIdx === q.ans;
            html += `<tr style="background:${isOk ? '#f0fdf4' : '#fef2f2'};">
                <td><b>Câu ${i + 1}</b></td>
                <td>${uText}</td>
                <td><b>${rText}</b></td>
                <td>${isOk ? '✅ Đúng' : '❌ Sai'} – ${q.ref}</td>
            </tr>`;
        });
        html += `</tbody></table></div>`;
        return html;
    }

    // Đang làm bài
    html += `<div class="exam-header">
        <div>Đã làm: <b>${Object.keys(ex.userAnswers).length} / ${EXAM_QUESTIONS.length}</b> câu</div>
        <div class="timer-display" id="timerDisplay">⏳ ${formatTime(ex.timeLeft)}</div>
        <button class="btn-submit-exam" onclick="submitExam(false)">📩 Nộp bài & Chấm điểm</button>
    </div>`;

    EXAM_QUESTIONS.forEach(q => {
        const chosen = ex.userAnswers[q.id];
        html += `<div class="q-item">
            <div class="q-title">${q.q}</div>
            <div class="options-list">`;
        q.opts.forEach((opt, idx) => {
            const isChecked = chosen === idx ? "checked" : "";
            const bg = chosen === idx ? "background:#eff6ff; border-color:var(--primary);" : "";
            html += `<label class="opt-label" style="${bg}" onclick="selectExamOpt('${q.id}', ${idx})">
                <input type="radio" name="exam_${q.id}" ${isChecked} style="pointer-events:none;">
                <span><b>${String.fromCharCode(65 + idx)}.</b> ${opt}</span>
            </label>`;
        });
        html += `</div></div>`;
    });

    html += `<div style="text-align:center; margin-top:1.5rem;">
        <button class="btn-submit-exam" onclick="submitExam(false)">📩 Nộp bài & Xem điểm</button>
    </div></div>`;
    return html;
}

(function() {

  // 2. Hàm tráo ngẫu nhiên mảng (Fisher-Yates)
  function shuffleWithAnswer(arr, ansIdx) {
    let indices = arr.map((_, i) => i);
    for (let i = indices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [indices[i], indices[j]] = [indices[j], indices[i]];
    }
    return {
      newArr: indices.map(i => arr[i]),
      newAns: indices.indexOf(ansIdx)
    };
  }

  // 3. Tự động quét và tráo đáp án cho Bài 8 đến Bài 13
  const targetLessons = ['bài 8', 'bài 9', 'bài 10', 'bài 11', 'bài 12', 'bài 13'];
  const letters = ['A', 'B', 'C', 'D'];

  for (let key in window) {
    try {
      let data = window[key];
      if (!data || typeof data !== 'object') continue;
      let items = Array.isArray(data) ? data : Object.values(data);

      items.forEach(item => {
        if (!item || typeof item !== 'object') return;
        let title = String(item.title || item.name || item.lesson || '').toLowerCase();
        let isTarget = targetLessons.some(t => title.includes(t));
        let qList = item.questions || item.quiz || (item.options || item.choices ? [item] : null);

        if ((isTarget || !title) && Array.isArray(qList)) {
          qList.forEach(q => {
            let opts = q.options || q.choices || q.answers;
            if (!Array.isArray(opts) || opts.length < 2) return;

            // Nhận diện đáp án đúng đang lưu dạng số (0, 1, 2, 3) hay chữ ("A", "B", "C", "D")
            let ansKey = ['answer', 'correct', 'correctAnswer', 'ans'].find(k => q[k] !== undefined);
            if (!ansKey) return;

            let rawAns = q[ansKey];
            let ansIdx = typeof rawAns === 'number' ? rawAns : letters.indexOf(String(rawAns).trim().toUpperCase());
            if (ansIdx < 0 || ansIdx >= opts.length) return;

            let shuffled = shuffleWithAnswer(opts, ansIdx);
            if (q.options) q.options = shuffled.newArr;
            else if (q.choices) q.choices = shuffled.newArr;

            q[ansKey] = typeof rawAns === 'number' ? shuffled.newAns : letters[shuffled.newAns];

<script>
(function() {
  // 1. Xóa sạch toàn bộ ký hiệu cite trên trang
  document.body.innerHTML = document.body.innerHTML.replace(/\[cite:[^\]]+\]/g, '');

  // 2. Hàm tráo ngẫu nhiên đáp án và cập nhật chỉ số ans
  function traoDapAn(q) {
    if (!q || q.type !== 'mc' || !Array.isArray(q.opts) || typeof q.ans !== 'number') return;
    if (!/^b(8|9|10|11|12|13)_/i.test(String(q.id || ''))) return;

    let indices = q.opts.map((_, i) => i);
    for (let i = indices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [indices[i], indices[j]] = [indices[j], indices[i]];
    }
    q.opts = indices.map(i => q.opts[i]);
    q.ans = indices.indexOf(q.ans);
  }

  // 3. Quét toàn bộ dữ liệu câu hỏi trong trang để áp dụng
  function quetDuLieu(obj, visited = new Set()) {
    if (!obj || typeof obj !== 'object' || visited.has(obj)) return;
    visited.add(obj);

    if (Array.isArray(obj)) {
      obj.forEach(item => {
        traoDapAn(item);
        quetDuLieu(item, visited);
      });
    } else {
      traoDapAn(obj);
      Object.values(obj).forEach(val => quetDuLieu(val, visited));
    }
  }

  for (let key in window) {
    try {
      if (window[key] && typeof window[key] === 'object' && key !== 'window' && key !== 'document') {
        quetDuLieu(window[key]);
      }
    } catch (e) {}
  }
})();
